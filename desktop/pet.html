<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面小宠物</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      user-select: none;
      background: transparent;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 像素小猫：两帧呼吸（尾巴摆动） */
    .cat {
      width: 44px;
      height: 40px;
      cursor: grab;
      border: none;
      background: transparent;
      padding: 0;
    }
    .cat:active { cursor: grabbing; }
    .cat svg { display: block; image-rendering: pixelated; }
    .frame-b { display: none; }
    .breathing .frame-a { display: none; }
    .breathing .frame-b { display: block; }
    @keyframes breatheFrames {
      0%, 46% { /* 帧 A */ }
      50%, 96% { /* 帧 B */ }
    }
    /* JS 驱动帧切换更可靠：这里只做柔和的整体微缩 */
    .cat { transition: transform 0.15s ease; }
  </style>
</head>
<body>
  <div class="stage">
    <button class="cat" id="cat" title="点亮开面板 · 按住拖动" aria-label="打开面板">
      <!-- 帧 A：常态（尾巴向右下） -->
      <svg class="frame-a" width="44" height="40" viewBox="0 0 22 20" shape-rendering="crispEdges" aria-hidden="true">
        <g>
          <!-- 耳朵 -->
          <rect x="3" y="1" width="2" height="2" fill="#f6c39a"/>
          <rect x="5" y="2" width="1" height="1" fill="#f6c39a"/>
          <rect x="16" y="1" width="2" height="2" fill="#f6c39a"/>
          <rect x="16" y="2" width="1" height="1" fill="#f6c39a"/>
          <rect x="4" y="2" width="1" height="1" fill="#f2a9c2"/>
          <rect x="16" y="2" width="1" height="1" fill="#f2a9c2"/>
          <!-- 头 -->
          <rect x="3" y="3" width="14" height="8" fill="#f6c39a"/>
          <rect x="2" y="4" width="1" height="6" fill="#f6c39a"/>
          <rect x="17" y="4" width="1" height="6" fill="#f6c39a"/>
          <!-- 条纹 -->
          <rect x="7" y="3" width="1" height="1" fill="#e8a678"/>
          <rect x="10" y="3" width="2" height="1" fill="#e8a678"/>
          <rect x="14" y="3" width="1" height="1" fill="#e8a678"/>
          <!-- 眼睛（闭合弧线的像素表现：两粒黑豆 + 高光） -->
          <rect x="6" y="6" width="2" height="2" fill="#3d2f28"/>
          <rect x="13" y="6" width="2" height="2" fill="#3d2f28"/>
          <rect x="6" y="6" width="1" height="1" fill="#fff"/>
          <rect x="13" y="6" width="1" height="1" fill="#fff"/>
          <!-- 鼻子与嘴 -->
          <rect x="10" y="8" width="1" height="1" fill="#e88aa5"/>
          <rect x="9" y="9" width="1" height="1" fill="#3d2f28"/>
          <rect x="11" y="9" width="1" height="1" fill="#3d2f28"/>
          <!-- 腮红 -->
          <rect x="4" y="8" width="1" height="1" fill="#f2a9c2"/>
          <rect x="16" y="8" width="1" height="1" fill="#f2a9c2"/>
          <!-- 身体 -->
          <rect x="4" y="11" width="12" height="6" fill="#f6c39a"/>
          <rect x="5" y="17" width="2" height="1" fill="#e8a678"/>
          <rect x="9" y="17" width="2" height="1" fill="#e8a678"/>
          <rect x="13" y="17" width="2" height="1" fill="#e8a678"/>
          <!-- 前爪 -->
          <rect x="6" y="16" width="2" height="1" fill="#fbd9b8"/>
          <rect x="12" y="16" width="2" height="1" fill="#fbd9b8"/>
          <!-- 尾巴 A：向右上翘 -->
          <rect x="16" y="13" width="1" height="2" fill="#f6c39a"/>
          <rect x="17" y="12" width="2" height="1" fill="#f6c39a"/>
        </g>
      </svg>
      <!-- 帧 B：眨眼（尾巴放平） -->
      <svg class="frame-b" width="44" height="40" viewBox="0 0 22 20" shape-rendering="crispEdges" aria-hidden="true">
        <g>
          <rect x="3" y="1" width="2" height="2" fill="#f6c39a"/>
          <rect x="5" y="2" width="1" height="1" fill="#f6c39a"/>
          <rect x="16" y="1" width="2" height="2" fill="#f6c39a"/>
          <rect x="16" y="2" width="1" height="1" fill="#f6c39a"/>
          <rect x="4" y="2" width="1" height="1" fill="#f2a9c2"/>
          <rect x="16" y="2" width="1" height="1" fill="#f2a9c2"/>
          <rect x="3" y="3" width="14" height="8" fill="#f6c39a"/>
          <rect x="2" y="4" width="1" height="6" fill="#f6c39a"/>
          <rect x="17" y="4" width="1" height="6" fill="#f6c39a"/>
          <rect x="7" y="3" width="1" height="1" fill="#e8a678"/>
          <rect x="10" y="3" width="2" height="1" fill="#e8a678"/>
          <rect x="14" y="3" width="1" height="1" fill="#e8a678"/>
          <!-- 眯眼（横向 1px） -->
          <rect x="6" y="7" width="2" height="1" fill="#3d2f28"/>
          <rect x="13" y="7" width="2" height="1" fill="#3d2f28"/>
          <rect x="10" y="8" width="1" height="1" fill="#e88aa5"/>
          <rect x="9" y="9" width="1" height="1" fill="#3d2f28"/>
          <rect x="11" y="9" width="1" height="1" fill="#3d2f28"/>
          <rect x="4" y="8" width="1" height="1" fill="#f2a9c2"/>
          <rect x="16" y="8" width="1" height="1" fill="#f2a9c2"/>
          <rect x="4" y="11" width="12" height="6" fill="#f6c39a"/>
          <rect x="5" y="17" width="2" height="1" fill="#e8a678"/>
          <rect x="9" y="17" width="2" height="1" fill="#e8a678"/>
          <rect x="13" y="17" width="2" height="1" fill="#e8a678"/>
          <rect x="6" y="16" width="2" height="1" fill="#fbd9b8"/>
          <rect x="12" y="16" width="2" height="1" fill="#fbd9b8"/>
          <!-- 尾巴 B：放平 -->
          <rect x="16" y="15" width="3" height="1" fill="#f6c39a"/>
        </g>
      </svg>
    </button>
  </div>
  <script>
    const cat = document.getElementById('cat');
    const desktop = window.desktop;

    // 呼吸：帧 A ↔ 帧 B（600ms 节奏，克制不吵）
    let frame = 0;
    setInterval(() => {
      frame = 1 - frame;
      cat.classList.toggle('breathing', frame === 1);
    }, 900);

    // 按下即拖动（位移>3px 进入拖动态）；原地点击 = 开关面板
    let pressed = false;
    let dragging = false;
    let startX = 0;
    let startY = 0;

    cat.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      pressed = true;
      dragging = false;
      startX = e.screenX;
      startY = e.screenY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!pressed) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      if (!dragging && Math.hypot(dx, dy) > 3) {
        dragging = true;
        desktop?.dragStart();
      }
      if (dragging) desktop?.dragMove();
    });

    window.addEventListener('mouseup', () => {
      if (!pressed) return;
      pressed = false;
      if (!dragging) desktop?.toggleDashboard();
      dragging = false;
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      desktop?.openMenu();
    });
  </script>
</body>
</html>
