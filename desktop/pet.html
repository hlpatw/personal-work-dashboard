<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面小宠物</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      user-select: none;
      -webkit-app-region: drag;          /* 整卡拖动，脸可点击 */
      background: transparent;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 高级感：一颗细腻的渐变光球，微表情，克制留白 */
    .orb {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background:
        radial-gradient(34% 26% at 33% 25%, rgba(255, 255, 255, 0.65), transparent 72%),
        linear-gradient(150deg, #ff9cbf 0%, #f2689c 52%, #d94a80 100%);
      box-shadow:
        0 4px 14px rgba(217, 74, 128, 0.45),
        inset -2px -4px 8px rgba(140, 20, 60, 0.35),
        inset 2px 3px 6px rgba(255, 255, 255, 0.5),
        inset 0 0 1.5px rgba(255, 255, 255, 0.6);
      animation: breathe 3.6s ease-in-out infinite;
      transition: filter 0.2s ease;
      -webkit-app-region: no-drag;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 小而亮的镜面高光点，赋予果冻感 */
    .orb::after {
      content: '';
      position: absolute;
      top: 20%;
      left: 28%;
      width: 6px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      filter: blur(0.2px);
      transform: rotate(-22deg);
      box-shadow: 0 0 3px rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }
    .orb:hover { filter: brightness(1.08) saturate(1.05); }
    .orb:active { transform: scale(0.93); }
    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
    }
    .eyes { display: flex; gap: 9px; }
    .eye {
      position: relative;
      width: 4.5px;
      height: 6px;
      background: #52333d;
      border-radius: 50%;
      animation: blink 5.2s infinite;
    }
    .eye::after {
      content: '';
      position: absolute;
      top: 0.6px;
      right: 0.6px;
      width: 1.6px;
      height: 1.6px;
      background: #fff;
      border-radius: 50%;
    }
    .smile {
      width: 7.5px;
      height: 4px;
      border: 1.8px solid #52333d;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    .ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(255, 156, 191, 0.35);
      animation: pulse 3.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.1); opacity: 0.15; }
    }
    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <button class="orb" title="点我打开面板 · 拖动移动 · 右键菜单" aria-label="打开面板">
      <span class="ring"></span>
      <span class="face">
        <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
        <span class="smile"></span>
      </span>
    </button>
  </div>
  <script>
    document.querySelector('.orb').addEventListener('click', () => window.desktop?.toggleDashboard());
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.desktop?.openMenu();
    });
  </script>
</body>
</html>
