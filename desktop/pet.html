<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面小宠物</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      user-select: none;
      background: transparent;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 像素小狗：两帧动画（耳朵+舌头） */
    .dog {
      width: 46px;
      height: 42px;
      cursor: grab;
      border: none;
      background: transparent;
      padding: 0;
      outline: none;
      display: block;
      position: relative;
    }
    .dog:active { cursor: grabbing; }
    /* 两帧同位叠放，靠可见性切换，避免布局抖动 */
    .dog svg {
      position: absolute;
      inset: 0;
      width: 46px;
      height: 42px;
      display: block;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .frame-b { visibility: hidden; }
    .excited .frame-a { visibility: hidden; }
    .excited .frame-b { visibility: visible; }
  </style>
</head>
<body>
  <div class="stage">
    <button class="dog" id="dog" title="点亮开面板 · 按住拖动" aria-label="打开面板">
      <!-- 帧 A：常态（垂耳，吐舌，圆头） -->
      <svg class="frame-a" width="46" height="42" viewBox="0 0 23 21" shape-rendering="crispEdges" aria-hidden="true">
        <g>
          <!-- 左耳（垂耳，深棕，圆底） -->
          <rect x="2" y="2" width="2" height="4" fill="#b57a45"/>
          <rect x="1" y="3" width="1" height="4" fill="#a86a38"/>
          <rect x="1" y="7" width="2" height="1" fill="#b57a45"/>
          <!-- 右耳 -->
          <rect x="18" y="2" width="2" height="4" fill="#b57a45"/>
          <rect x="20" y="3" width="1" height="4" fill="#a86a38"/>
          <rect x="19" y="7" width="2" height="1" fill="#b57a45"/>
          <!-- 头（奶油，圆润剪影：顶弧阶梯 + 饱满两颊 + 单行收下巴） -->
          <rect x="6" y="1" width="9" height="1" fill="#f0c987"/>
          <rect x="4" y="2" width="13" height="1" fill="#f0c987"/>
          <rect x="3" y="3" width="15" height="2" fill="#f0c987"/>
          <rect x="2" y="5" width="17" height="4" fill="#f0c987"/>
          <rect x="3" y="9" width="15" height="1" fill="#f0c987"/>
          <rect x="4" y="10" width="13" height="1" fill="#f0c987"/>
          <!-- 眉点 -->
          <rect x="6" y="4" width="1" height="1" fill="#c99a55"/>
          <rect x="14" y="4" width="1" height="1" fill="#c99a55"/>
          <!-- 眼睛 -->
          <rect x="6" y="5" width="2" height="2" fill="#3a2c22"/>
          <rect x="13" y="5" width="2" height="2" fill="#3a2c22"/>
          <rect x="6" y="5" width="1" height="1" fill="#fff"/>
          <rect x="13" y="5" width="1" height="1" fill="#fff"/>
          <!-- 口鼻（浅色，圆润） -->
          <rect x="8" y="8" width="5" height="3" fill="#fbe9c4"/>
          <rect x="10" y="8" width="1" height="1" fill="#3a2c22"/>
          <!-- 嘴 + 舌头 -->
          <rect x="9" y="10" width="1" height="1" fill="#3a2c22"/>
          <rect x="12" y="10" width="1" height="1" fill="#3a2c22"/>
          <rect x="10" y="10" width="2" height="1" fill="#ef9aa5"/>
          <!-- 腮红（随两颊外移） -->
          <rect x="4" y="7" width="1" height="1" fill="#f2b8a0"/>
          <rect x="16" y="7" width="1" height="1" fill="#f2b8a0"/>
          <!-- 身体 -->
          <rect x="5" y="11" width="11" height="6" fill="#f0c987"/>
          <rect x="6" y="17" width="9" height="1" fill="#e8bd72"/>
          <!-- 胸前浅毛 -->
          <rect x="9" y="12" width="3" height="4" fill="#fbe9c4"/>
          <!-- 前爪 -->
          <rect x="6" y="16" width="2" height="1" fill="#fbe9c4"/>
          <rect x="13" y="16" width="2" height="1" fill="#fbe9c4"/>
          <!-- 尾巴 A（上翘） -->
          <rect x="16" y="12" width="1" height="2" fill="#f0c987"/>
          <rect x="17" y="11" width="1" height="1" fill="#c99a55"/>
          <rect x="17" y="10" width="1" height="1" fill="#f0c987"/>
        </g>
      </svg>
      <!-- 帧 B：兴奋（竖耳，吐舌更长，尾巴摆，圆头） -->
      <svg class="frame-b" width="46" height="42" viewBox="0 0 23 21" shape-rendering="crispEdges" aria-hidden="true">
        <g>
          <!-- 竖耳（圆尖） -->
          <rect x="4" y="0" width="2" height="2" fill="#b57a45"/>
          <rect x="4" y="2" width="1" height="2" fill="#a86a38"/>
          <rect x="16" y="0" width="2" height="2" fill="#b57a45"/>
          <rect x="17" y="2" width="1" height="2" fill="#a86a38"/>
          <!-- 头（圆润剪影，同帧 A） -->
          <rect x="6" y="1" width="9" height="1" fill="#f0c987"/>
          <rect x="4" y="2" width="13" height="1" fill="#f0c987"/>
          <rect x="3" y="3" width="15" height="2" fill="#f0c987"/>
          <rect x="2" y="5" width="17" height="4" fill="#f0c987"/>
          <rect x="3" y="9" width="15" height="1" fill="#f0c987"/>
          <rect x="4" y="10" width="13" height="1" fill="#f0c987"/>
          <rect x="6" y="4" width="1" height="1" fill="#c99a55"/>
          <rect x="14" y="4" width="1" height="1" fill="#c99a55"/>
          <!-- 眯眼（开心） -->
          <rect x="6" y="6" width="2" height="1" fill="#3a2c22"/>
          <rect x="13" y="6" width="2" height="1" fill="#3a2c22"/>
          <rect x="8" y="8" width="5" height="3" fill="#fbe9c4"/>
          <rect x="10" y="8" width="1" height="1" fill="#3a2c22"/>
          <rect x="9" y="10" width="1" height="1" fill="#3a2c22"/>
          <rect x="12" y="10" width="1" height="1" fill="#3a2c22"/>
          <!-- 长舌头 -->
          <rect x="10" y="10" width="2" height="2" fill="#ef9aa5"/>
          <rect x="4" y="7" width="1" height="1" fill="#f2b8a0"/>
          <rect x="16" y="7" width="1" height="1" fill="#f2b8a0"/>
          <!-- 身体 -->
          <rect x="5" y="11" width="11" height="6" fill="#f0c987"/>
          <rect x="6" y="17" width="9" height="1" fill="#e8bd72"/>
          <rect x="9" y="12" width="3" height="4" fill="#fbe9c4"/>
          <rect x="6" y="16" width="2" height="1" fill="#fbe9c4"/>
          <rect x="13" y="16" width="2" height="1" fill="#fbe9c4"/>
          <!-- 尾巴 B（平伸） -->
          <rect x="16" y="13" width="3" height="1" fill="#c99a55"/>
        </g>
      </svg>
    </button>
  </div>
  <script>
    const dog = document.getElementById('dog');
    // 注意：不能声明 `const desktop`——preload 的 contextBridge 已在全局注入同名标识符，
    // 重复声明会导致整块脚本解析失败（SyntaxError），所有交互失效。直接使用 window.desktop。
    const bridge = window.desktop;

    // 两帧动画：常态 ↔ 兴奋（拖动时立即兴奋）
    let excited = false;
    let timer = null;
    const setExcited = (v) => {
      if (excited === v) return;
      excited = v;
      dog.classList.toggle('excited', v);
    };
    // 闲时偶尔开心一下（8~14 秒随机）
    const scheduleIdle = () => {
      timer = setTimeout(() => {
        setExcited(true);
        setTimeout(() => { if (!dragging) setExcited(false); }, 1400);
        scheduleIdle();
      }, 8000 + Math.random() * 6000);
    };
    scheduleIdle();

    // 拖动：按下位移>3px 即进入拖动态；原地点击 = 开关面板。
    // 关键设计：
    // 1. Pointer Capture——指针移出小窗口后事件仍持续送达
    // 2. 位移判定用 screenX/Y（窗口移动不影响 screen 坐标系；
    //    clientX/Y 以窗口为原点，窗口一动坐标就漂，不能用于累计位移）
    let pressed = false;
    let dragging = false;
    let startX = 0;
    let startY = 0;

    dog.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      pressed = true;
      dragging = false;
      startX = e.screenX;
      startY = e.screenY;
      try { dog.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件无捕获 */ }
    });

    dog.addEventListener('pointermove', (e) => {
      if (!pressed) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      if (!dragging && Math.hypot(dx, dy) > 3) {
        dragging = true;
        setExcited(true);
        bridge?.dragStart();
      }
      if (dragging) bridge?.dragMove(dx, dy);
    });

    dog.addEventListener('pointerup', (e) => {
      if (!pressed) return;
      pressed = false;
      try { dog.releasePointerCapture(e.pointerId); } catch (_) { /* 已释放 */ }
      if (!dragging) {
        // 点击瞬间也开心一下
        setExcited(true);
        setTimeout(() => { if (!dragging) setExcited(false); }, 1200);
        bridge?.toggleDashboard();
      } else {
        setExcited(false);
      }
      dragging = false;
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      bridge?.openMenu();
    });
  </script>
</body>
</html>
