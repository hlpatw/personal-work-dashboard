<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面小宠物</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      user-select: none;
      /* 整卡可拖动；脸是 no-drag 可点击 */
      -webkit-app-region: drag;
      background: linear-gradient(160deg, #fb8bb0 0%, #f2608f 55%, #e84a7f 100%);
      border-radius: 24px;
    }
    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 18px;
    }
    /* 顶部柔光，让卡片有果冻质感 */
    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 70% at 50% -10%, rgba(255, 255, 255, 0.5), transparent 60%);
      pointer-events: none;
    }
    .pet {
      position: relative;
      width: 96px;
      height: 88px;
      animation: bob 3.2s ease-in-out infinite;
    }
    .ear {
      position: absolute;
      width: 24px;
      height: 32px;
      background: linear-gradient(160deg, #ffd3e2, #ffb6cd);
      border-radius: 50% 50% 46% 46%;
      top: -14px;
      box-shadow: 0 2px 6px rgba(160, 20, 70, 0.25);
    }
    .ear.left { left: 14px; transform: rotate(-16deg); }
    .ear.right { right: 14px; transform: rotate(16deg); }
    .ear::after {
      content: '';
      position: absolute;
      inset: 6px 6px 3px 6px;
      background: #ff9dbf;
      border-radius: 50% 50% 42% 42%;
    }
    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      -webkit-app-region: no-drag;
      cursor: pointer;
      background: linear-gradient(165deg, #ff9fc2 0%, #f76ba0 100%);
      border-radius: 48% 46% 46% 48% / 56% 56% 44% 44%;
      box-shadow:
        inset -5px -8px 14px rgba(160, 20, 70, 0.28),
        inset 3px 5px 10px rgba(255, 255, 255, 0.45);
      transition: transform 0.15s ease;
    }
    .face:active { transform: scale(0.94); }
    .eyes { display: flex; gap: 18px; }
    .eye {
      width: 11px;
      height: 14px;
      background: #4a333d;
      border-radius: 50%;
      animation: blink 4.6s infinite;
    }
    .mouth {
      width: 15px;
      height: 7px;
      border: 2.5px solid #4a333d;
      border-top: none;
      border-radius: 0 0 14px 14px;
    }
    .blush {
      position: absolute;
      width: 17px;
      height: 9px;
      background: rgba(255, 205, 222, 0.9);
      border-radius: 50%;
      top: 52px;
      filter: blur(0.6px);
    }
    .blush.left { left: 4px; }
    .blush.right { right: 4px; }
    .hint {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(160, 20, 70, 0.3);
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="hint">拖动移动 · 点脸开面板</span>
    <div class="pet">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <button class="face" title="点我打开面板" aria-label="打开面板">
        <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
        <span class="mouth"></span>
        <span class="blush left"></span>
        <span class="blush right"></span>
      </button>
    </div>
  </div>
  <script>
    const face = document.querySelector('.face');
    face.addEventListener('click', () => window.desktop?.toggleDashboard());
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.desktop?.openMenu();
    });
  </script>
</body>
</html>
